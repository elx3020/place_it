<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>place_it render demo</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
      #stage { position: relative; width: 640px; max-width: 100vw; aspect-ratio: 4 / 3; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      label, p { display: block; margin: 8px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas><canvas id="tinted" hidden></canvas></div>
    <label><input type="checkbox" id="tint" /> Tint pass</label>
    <p id="status">Loading...</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
