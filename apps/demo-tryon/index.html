<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>place_it try-on demo</title>
    <style>
      body { margin: 0; padding: 8px; background: #111; color: #eee; font: 14px sans-serif; }
      label, button, p { margin: 4px 8px 4px 0; }
      #preview { width: 240px; height: 240px; cursor: crosshair; display: block; margin: 8px 0; }
      #json { width: 100%; max-width: 640px; height: 3em; display: block; }
      #view { width: 100%; max-width: 640px; display: block; margin-top: 8px; }
      #error { color: #f88; }
    </style>
  </head>
  <body>
    <p>Drop a GLB anywhere, or <input type="file" id="file" accept=".glb,model/gltf-binary" aria-label="GLB model" /></p>
    <label>Target <select id="target"><option value="ear">ear</option><option value="neck">neck</option></select></label>
    <label><input type="checkbox" id="mirror" /> Mirror to both ears</label>
    <canvas id="preview" width="240" height="240" aria-label="Model preview: click to set the anchor"></canvas>
    <p>Anchor (model meters): <span id="anchor">0.000, 0.000, 0.000</span></p>
    <button id="export">Export config</button> <button id="import">Import config</button>
    <textarea id="json" aria-label="Config JSON"></textarea>
    <p><button id="tryon">Try on</button></p>
    <p id="status" role="status">Choose a GLB.</p>
    <p id="error" role="alert"></p>
    <canvas id="view"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
