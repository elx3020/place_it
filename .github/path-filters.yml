# Consumed by dorny/paths-filter in ci.yml. scripts/check-ci.mjs asserts every package/app dir is covered.
# Each area also lists the packages it depends on, plus shared root files.
core:
  - 'packages/core/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
platform-web:
  - 'packages/platform-web/**'
  - 'packages/core/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
tracking:
  - 'packages/tracking/**'
  - 'packages/platform-web/**'
  - 'packages/core/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
render:
  - 'packages/render/**'
  - 'packages/platform-web/**'
  - 'packages/core/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
physics:
  - 'packages/physics/**'
  - 'packages/platform-web/**'
  - 'packages/core/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
place-it:
  - 'packages/place-it/**'
  - 'packages/**'
  - 'apps/demo-tryon/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
demo:
  - 'apps/**'
  - 'packages/**'
  - '.github/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'package.json'
  - 'tsconfig*.json'
